[env]
BLENDER_USER_RESOURCES = "{{config_root}}/target/tmp/blender-user"

[tasks.demo]
description = "Build and render the demo characters (args: [--no-render] [--samples N] [name ...])"
run = "blender -b --python-use-system-env -P tools/demo/make_demo.py --"

[tasks.groom]
description = "Groom the demo bob and curls from the hair-editor pack into <out>/hair/demo_hair.blend (arg: [path.blend])"
run = "blender -b --python-use-system-env -P tools/demo/groom_hair.py --"
